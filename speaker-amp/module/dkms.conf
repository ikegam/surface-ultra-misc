PACKAGE_NAME="n1x-rt1320-sdw"
PACKAGE_VERSION="7.3-surface1"
MAKE[0]="make -C ${kernel_source_dir} KERNELRELEASE=${kernelver} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="snd-soc-rt1320-sdw"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Source taken from v7.3; rebuild and re-check before using it on another kernel series.
BUILD_EXCLUSIVE_KERNEL="^7\.3\."
AUTOINSTALL="yes"
