# Keep the built-in speakers open while idle: waking the SoundWire link and both RT1320
# amps (and their DSP) takes ~2 s, so playback started late. Costs some idle power.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-mtk_sdw_mc.HiFi__Speaker__sink" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
